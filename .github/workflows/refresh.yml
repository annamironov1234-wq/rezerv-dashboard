name: refresh-dashboard
on:
  # ВАЖНО про расписание GitHub: это НЕ таймер, а очередь, и она best-effort.
  # Замер 03.08: запуск, поставленный на 20:47 МСК, реально стартовал в 22:10 (+1ч23м),
  # а соседний по расписанию не стартовал вообще. Ровно в :00 очередь хуже всего.
  # Отсюда стратегия: не одна точка, а ОКНО из нескольких попыток, которое
  # заканчивается ЗА полтора часа до момента, когда данные должны быть на месте.
  # Прогон занимает ~1 минуту и просто перезаписывает страницу — лишний безвреден.
  # Замер 03–04.08: из шести слотов сработал ОДИН, и тот с опозданием на 1ч23м.
  # Поэтому расписание здесь — только подстраховка «вдруг повезёт», а настоящий
  # будильник снаружи: cron-job.org бьёт по workflow_dispatch строго по часам.
  # Инструкция и что делать, если сломается: docs/автообновление.md
  schedule:
    - cron: '13 1 * * *'      # 04:13 МСК
    - cron: '37 3 * * *'      # 06:37 МСК
    - cron: '13 14 * * *'     # 17:13 МСК
    - cron: '37 15 * * *'     # 18:37 МСК
  workflow_dispatch:           # можно запустить вручную кнопкой
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Тянем Google -> считаем -> собираем файл
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          python -m pipeline.gsync
          python -m pipeline.build
          python -m pipeline.publish
          mkdir -p _site
          cp dist/rezerv-dashboard.html _site/index.html
          cp dist/apple-touch-icon.png _site/apple-touch-icon.png
          cp dist/stamp.txt _site/stamp.txt
          cp dist/sw.js _site/sw.js
          cp dist/metrics.json _site/metrics.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
