name: refresh-dashboard
on:
  # ВАЖНО про расписание GitHub: это НЕ таймер, а очередь, и она best-effort.
  # Замер 03.08: запуск, поставленный на 20:47 МСК, реально стартовал в 22:10 (+1ч23м),
  # а соседний по расписанию не стартовал вообще. Ровно в :00 очередь хуже всего.
  # Отсюда стратегия: не одна точка, а ОКНО из нескольких попыток, которое
  # заканчивается ЗА полтора часа до момента, когда данные должны быть на месте.
  # Прогон занимает ~1 минуту и просто перезаписывает страницу — лишний безвреден.
  # Замер 03–04.08: из шести слотов сработал ОДИН, и тот с опозданием на 1ч23м.
  # Поэтому расписание здесь — только подстраховка «вдруг повезёт», а настоящий
  # будильник снаружи: cron-job.org бьёт по workflow_dispatch строго по часам.
  # Инструкция и что делать, если сломается: docs/автообновление.md
  schedule:
    - cron: '13 1 * * *'      # 04:13 МСК
    - cron: '37 3 * * *'      # 06:37 МСК
    - cron: '13 14 * * *'     # 17:13 МСК
    - cron: '37 15 * * *'     # 18:37 МСК
  workflow_dispatch:           # можно запустить вручную кнопкой

# 17.08.2026: переехали с GitHub Pages на Netlify. Причина не в удобстве —
# на Pages страница с ФИО сотрудников, окладами и премиями была доступна
# всему интернету без пароля. Pages бесплатно публикуется только из публичного
# репозитория, а публичный репозиторий значит публичный сайт. Прав pages/id-token
# больше не нужно.
permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt

      - name: Тянем Google -> считаем -> собираем
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          # Служебный ключ: им сборка забирает слепок прошлых цифр, чтобы
          # сравнить с новыми. Без него сравнение молча выключается,
          # а это главная защита от тихих поломок.
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
          DASH_URL: ${{ secrets.DASH_URL }}
        run: |
          python -m pipeline.gsync
          python -m pipeline.build
          python -m pipeline.publish

      - name: Проверяем, что в публичную папку не попали цифры
        # Пояс поверх подтяжек: publish.py это уже проверяет и падает сам.
        # Но именно здесь ошибка стоит дороже всего, поэтому смотрим ещё раз
        # и чужими глазами — простым поиском по файлам.
        run: |
          if grep -rlE '"оклад"|"премия"|window\.__DATA__|"счет_ндс"' _site/ 2>/dev/null; then
            echo "СТОП: в _site нашлись данные. Публикации не будет."
            exit 1
          fi
          if [ ! -s private/data.json ]; then
            echo "СТОП: private/data.json пуст или отсутствует."
            exit 1
          fi
          echo "Публичная папка чистая, цифры лежат отдельно."

      - name: Публикуем на Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npm install -g netlify-cli@latest
          netlify deploy --prod --dir=_site --functions=netlify/functions
