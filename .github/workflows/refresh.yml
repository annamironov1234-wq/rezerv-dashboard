name: refresh-dashboard
on:
  # ВАЖНО: GitHub ставит расписания в общую очередь и ровно в :00 она перегружена —
  # запуск задерживается или пропадает совсем. Поэтому время смещено с круглого часа
  # и на каждый слот есть дубль-подстраховка через 40 минут (лишний прогон безвреден).
  schedule:
    - cron: '7 4 * * 1-5'     # Пн–Пт 07:07 МСК  — основной утренний
    - cron: '47 4 * * 1-5'    # Пн–Пт 07:47 МСК  — подстраховка, чтобы к 08:00 данные были
    - cron: '7 17 * * 1-5'    # Пн–Пт 20:07 МСК  — основной вечерний
    - cron: '47 17 * * 1-5'   # Пн–Пт 20:47 МСК  — подстраховка
  workflow_dispatch:           # можно запустить вручную кнопкой
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Тянем Google -> считаем -> собираем файл
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: |
          python -m pipeline.gsync
          python -m pipeline.build
          python -m pipeline.publish
          mkdir -p _site
          cp dist/rezerv-dashboard.html _site/index.html
          cp dist/apple-touch-icon.png _site/apple-touch-icon.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
