<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Резерв Сил · вход</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --deep:#1a1560; --blue:#0e8fd0; --crimson:#b23a4b;
    --bg:#eef1f6; --surface:#fff; --line:#e0e6f0;
    --ink:#141a33; --ink-2:#4a5573; --muted:#8b95ad;
    --sans:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);display:grid;place-items:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .карточка{
    width:100%;max-width:380px;background:var(--surface);
    border:1px solid var(--line);border-radius:18px;
    padding:32px 26px;box-shadow:0 12px 40px rgba(26,21,96,.10);
  }
  h1{margin:0 0 6px;font-size:22px;font-weight:800;color:var(--deep);letter-spacing:-.2px}
  .под{margin:0 0 22px;font-size:14px;color:var(--ink-2);line-height:1.45}
  label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
  input{
    width:100%;padding:13px 14px;font-size:16px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:11px;background:#fbfcfe;
    color:var(--ink);transition:border-color .15s;
  }
  input:focus{outline:none;border-color:var(--blue);background:#fff}
  button{
    width:100%;margin-top:16px;padding:13px;font-size:16px;font-weight:700;
    font-family:inherit;color:#fff;background:var(--deep);
    border:0;border-radius:11px;cursor:pointer;transition:opacity .15s;
  }
  button:hover{opacity:.9}
  button:disabled{opacity:.5;cursor:default}
  .ошибка{
    margin-top:14px;padding:11px 13px;border-radius:10px;font-size:14px;
    background:#fdeef0;color:var(--crimson);border:1px solid #f5d3d8;display:none;
  }
  .ошибка.видно{display:block}
  .низ{margin-top:20px;font-size:12.5px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
  <form class="карточка" id="форма">
    <h1>Резерв Сил</h1>
    <p class="под">Финансовый дашборд. Введите пароль один раз — дальше устройство запомнит вас на месяц.</p>

    <label for="пароль">Пароль</label>
    <input id="пароль" type="password" autocomplete="current-password" autofocus required>

    <button type="submit" id="кнопка">Войти</button>
    <div class="ошибка" id="ошибка"></div>

    <p class="низ">Здесь зарплаты и деньги клиентов. Не пересылайте адрес и пароль в переписке.</p>
  </form>

<script>
const форма  = document.getElementById('форма');
const поле   = document.getElementById('пароль');
const кнопка = document.getElementById('кнопка');
const ошибка = document.getElementById('ошибка');

function сказать(текст){
  ошибка.textContent = текст;
  ошибка.classList.add('видно');
}

форма.addEventListener('submit', async (e) => {
  e.preventDefault();
  ошибка.classList.remove('видно');
  кнопка.disabled = true;
  кнопка.textContent = 'Проверяю…';

  try {
    const ответ = await fetch('/api/login', {
      method: 'POST',
      headers: {'content-type':'application/json'},
      body: JSON.stringify({ пароль: поле.value }),
    });

    if (ответ.ok) {
      location.replace('/app');   // дальше всё как всегда
      return;
    }

    const тело = await ответ.json().catch(() => ({}));
    сказать(тело.ошибка || 'Не пускает. Попробуйте ещё раз.');
  } catch {
    сказать('Нет связи с сервером. Проверьте интернет.');
  }

  кнопка.disabled = false;
  кнопка.textContent = 'Войти';
  поле.value = '';
  поле.focus();
});
</script>
</body>
</html>
